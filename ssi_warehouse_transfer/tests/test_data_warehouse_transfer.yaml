scenarios:
  - name: "WarehouseTransfer - Confirm and Cancel flow"
    steps:
      - step: "Get existing warehouse"
        action: "search"
        model: "stock.warehouse"
        domain: []
        save_as: "warehouse"
        limit: 1

      - step: "Get internal location"
        action: "search"
        model: "stock.location"
        domain:
          - ["usage", "=", "internal"]
        save_as: "location"
        limit: 1

      - step: "Create route"
        action: "create"
        model: "stock.location.route"
        save_as: "route"
        values:
          name: "Test Route WT Confirm"

      - step: "Get product UoM (Units)"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test Product WT Confirm"

      - step: "Create transfer type"
        action: "create"
        model: "warehouse_transfer_type"
        save_as: "transfer_type"
        values:
          name: "Test Transfer Type Confirm"
          code: "TTCONF"

      - step: "Create warehouse transfer with line"
        action: "create"
        model: "warehouse_transfer"
        save_as: "transfer"
        as_user: "base.user_admin"
        values:
          date: "2024-01-01"
          type_id: "EVAL: registry['transfer_type'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          route_id: "EVAL: registry['route'].id"
          outbound_location_id: "EVAL: registry['location'].id"
          inbound_location_id: "EVAL: registry['location'].id"
          line_ids:
            - - 0
              - 0
              - name: "Test Line WT Confirm"
                product_id: "EVAL: registry['product'].id"
                uom_id: "EVAL: registry['uom'].id"
                uom_quantity: 5.0
                sequence: 10

      - step: "Assert transfer created in draft"
        action: "assert"
        target: "transfer"
        asserts:
          state:
            type: "value"
            expected: "draft"
          uom_quantity:
            type: "value"
            expected: 5.0

      - step: "Confirm transfer"
        action: "call"
        target: "transfer"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Invalidate cache after confirm"
        action: "call"
        target: "transfer"
        method: "invalidate_cache"

      - step: "Cancel transfer from confirm"
        action: "call"
        target: "transfer"
        method: "action_cancel"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "cancel"

      - step: "Restart transfer from cancel"
        action: "call"
        target: "transfer"
        method: "action_restart"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "draft"

  - name: "WarehouseTransfer - Computed fields with lines"
    steps:
      - step: "Get existing warehouse"
        action: "search"
        model: "stock.warehouse"
        domain: []
        save_as: "warehouse"
        limit: 1

      - step: "Get internal location"
        action: "search"
        model: "stock.location"
        domain:
          - ["usage", "=", "internal"]
        save_as: "location"
        limit: 1

      - step: "Create route"
        action: "create"
        model: "stock.location.route"
        save_as: "route"
        values:
          name: "Test Route WT Lines"

      - step: "Get product UoM (Units)"
        action: "ref"
        xml_id: "uom.product_uom_unit"
        save_as: "uom"

      - step: "Create product"
        action: "create"
        model: "product.product"
        save_as: "product"
        values:
          name: "Test Product WT Lines"

      - step: "Create transfer type"
        action: "create"
        model: "warehouse_transfer_type"
        save_as: "transfer_type"
        values:
          name: "Test Transfer Type Lines"
          code: "TTLINES"

      - step: "Create warehouse transfer with lines"
        action: "create"
        model: "warehouse_transfer"
        save_as: "transfer"
        as_user: "base.user_admin"
        values:
          date: "2024-01-01"
          type_id: "EVAL: registry['transfer_type'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          route_id: "EVAL: registry['route'].id"
          outbound_location_id: "EVAL: registry['location'].id"
          inbound_location_id: "EVAL: registry['location'].id"
          line_ids:
            - - 0
              - 0
              - name: "Test Line WT"
                product_id: "EVAL: registry['product'].id"
                uom_id: "EVAL: registry['uom'].id"
                uom_quantity: 10.0
                sequence: 10

      - step: "Assert computed fields on transfer"
        action: "assert"
        target: "transfer"
        asserts:
          uom_quantity:
            type: "value"
            expected: 10.0
          qty_to_deliver:
            type: "value"
            expected: 10.0
          qty_to_receipt:
            type: "value"
            expected: 0.0
          qty_received:
            type: "value"
            expected: 0.0
          qty_delivered:
            type: "value"
            expected: 0.0

      - step: "Assert line count"
        action: "assert"
        target: "transfer"
        asserts:
          line_ids:
            type: "o2m"
            check: "count"
            expected_count: 1
