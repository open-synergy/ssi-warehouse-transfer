scenarios:
  - name: "WarehouseTransfer - Documenso Signing: has signing fields"
    steps:
      - step: "Get existing warehouse"
        action: "search"
        model: "stock.warehouse"
        domain: []
        save_as: "warehouse"
        limit: 1

      - step: "Get internal location"
        action: "search"
        model: "stock.location"
        domain:
          - ["usage", "=", "internal"]
        save_as: "location"
        limit: 1

      - step: "Create route"
        action: "create"
        model: "stock.location.route"
        save_as: "route"
        values:
          name: "Test Route WT DS"

      - step: "Create transfer type"
        action: "create"
        model: "warehouse_transfer_type"
        save_as: "transfer_type"
        values:
          name: "Test Transfer Type DS"
          code: "TTDS"

      - step: "Create warehouse transfer"
        action: "create"
        model: "warehouse_transfer"
        save_as: "transfer"
        as_user: "base.user_admin"
        values:
          date: "2024-01-01"
          type_id: "EVAL: registry['transfer_type'].id"
          outbound_warehouse_id: "EVAL: registry['warehouse'].id"
          inbound_warehouse_id: "EVAL: registry['warehouse'].id"
          route_id: "EVAL: registry['route'].id"
          outbound_location_id: "EVAL: registry['location'].id"
          inbound_location_id: "EVAL: registry['location'].id"

      - step: "Assert warehouse transfer has documenso signing fields"
        action: "assert"
        target: "transfer"
        asserts:
          state:
            type: "value"
            expected: "draft"
          signature_request_ids:
            type: "value"
            operator: "is_falsy"
          signature_request_count:
            type: "value"
            expected: 0
